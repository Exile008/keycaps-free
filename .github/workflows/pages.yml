# Deploys the static keycap generator to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Run core tests
        run: |
          node tests/geometry.test.mjs
          node tests/legend-export.test.mjs

      - name: Assemble site (runtime files only)
        run: |
          mkdir _site
          cp -r index.html css js vendor fonts _site/
          touch _site/.nojekyll
          # Version-tag module URLs so browsers never mix cached old and new modules.
          node .github/scripts/stamp-version.mjs _site "${GITHUB_SHA::12}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
